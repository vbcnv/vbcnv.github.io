    <script>
        // Apply theme and reminder state before first paint to avoid a flash.
        (function () {
            var root = document.documentElement;
            var theme = null;
            var dismissed = null;
            try {
                theme = localStorage.getItem('theme');
                dismissed = localStorage.getItem('reminder-dismissed');
            } catch (e) { }
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                root.classList.add('dark');
            }
            if (dismissed === new Date().toDateString()) {
                root.dataset.reminder = 'hidden';
            }
        })();
    </script>

        <!-- Daily reminder -->
        <div id="reminder" class="pointer-events-none fixed inset-x-0 bottom-0 z-10 flex justify-center p-4 sm:pb-6">
            <div class="reveal pointer-events-auto flex max-w-xl items-center gap-3 rounded-2xl border border-zinc-200/80 bg-white/80 py-2 pl-3 pr-2 text-sm shadow-lg shadow-zinc-900/[0.06] backdrop-blur-xl dark:border-white/10 dark:bg-zinc-900/80 dark:shadow-black/30"
                style="--d: 500ms" role="status">
                <span
                    class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-emerald-50 text-emerald-600 ring-1 ring-inset ring-emerald-100 dark:bg-emerald-500/10 dark:text-emerald-400 dark:ring-emerald-500/20">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="h-5 w-5" aria-hidden="true">
                        <path d="M4.75 13C4.75 7.4 19.25 4.75 19.25 4.75C19.25 4.75 18.25 19.25 12 19.25C8 19.25 4.75 17 4.75 13Z"
                            stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M4.75 19.25C4.75 19.25 8 14 12.25 11.75" stroke="currentColor" stroke-width="1.75"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </span>
                <p class="leading-snug text-zinc-600 dark:text-zinc-400">
                    <strong class="font-semibold text-zinc-900 dark:text-white">Dagelijkse herinnering:</strong>
                    vergeet niet je computer uit te zetten voordat je weggaat!
                </p>
                <button type="button" id="reminder-close" aria-label="Herinnering verbergen voor vandaag"
                    title="Verbergen voor vandaag"
                    class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-zinc-400 transition hover:bg-zinc-100 hover:text-zinc-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand/60 dark:hover:bg-white/5 dark:hover:text-white">
                    <svg class="h-4 w-4" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var root = document.documentElement;

            function store(key, value) {
                try { localStorage.setItem(key, value); } catch (e) { }
            }

            // Greeting + clock
            var greeting = document.getElementById('greeting');
            var clock = document.getElementById('clock');
            var dateFormat = new Intl.DateTimeFormat('nl-BE', { weekday: 'long', day: 'numeric', month: 'long' });
            var timeFormat = new Intl.DateTimeFormat('nl-BE', { hour: '2-digit', minute: '2-digit' });

            function tick() {
                var now = new Date();
                var hour = now.getHours();
                greeting.textContent = hour < 6 ? 'Goedenacht' : hour < 12 ? 'Goedemorgen' : hour < 18 ? 'Goedemiddag' : 'Goedenavond';
                clock.textContent = dateFormat.format(now) + ' · ' + timeFormat.format(now);
                clock.dateTime = now.toISOString();
                setTimeout(tick, 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()));
            }
            tick();

            // Theme toggle
            document.getElementById('theme-toggle').addEventListener('click', function () {
                var dark = root.classList.toggle('dark');
                store('theme', dark ? 'dark' : 'light');
            });

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
                var saved = null;
                try { saved = localStorage.getItem('theme'); } catch (err) { }
                if (!saved) root.classList.toggle('dark', e.matches);
            });

            // Admin apps menu
            var apps = document.getElementById('apps');
            var appsButton = document.getElementById('apps-button');
            var appsMenu = document.getElementById('apps-menu');

            function setMenu(open) {
                appsButton.setAttribute('aria-expanded', String(open));
                if (open) {
                    appsMenu.setAttribute('data-open', '');
                    appsMenu.querySelector('a').focus();
                } else {
                    appsMenu.removeAttribute('data-open');
                }
            }

            appsButton.addEventListener('click', function () {
                setMenu(!appsMenu.hasAttribute('data-open'));
            });

            document.addEventListener('click', function (e) {
                if (appsMenu.hasAttribute('data-open') && !apps.contains(e.target)) setMenu(false);
            });

            // Daily reminder: hide for the rest of the day
            document.getElementById('reminder-close').addEventListener('click', function () {
                root.dataset.reminder = 'hidden';
                store('reminder-dismissed', new Date().toDateString());
            });

            // Keyboard: "/" focuses search, Escape closes the menu
            var search = document.getElementById('search');
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && appsMenu.hasAttribute('data-open')) {
                    setMenu(false);
                    appsButton.focus();
                    return;
                }
                var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
                if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    e.preventDefault();
                    search.focus();
                    search.select();
                }
            });
        })();
    </script>
